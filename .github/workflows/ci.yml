name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, tests unitaires, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Version de pnpm lue dans le champ packageManager du package.json racine
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # postinstall de l'API : prisma generate (aucune base nécessaire)
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Vérifier que le client API généré est à jour
        run: |
          pnpm api-client:generate
          git diff --exit-code -- libs/api-client || {
            echo "::error::libs/api-client ne correspond plus à l'API : lancez pnpm api-client:generate et commitez le résultat."
            exit 1
          }

  web-e2e:
    name: Front — responsive et accessibilité (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Installer Chromium
        run: pnpm --filter @devmirror/web exec playwright install --with-deps chromium
      # API simulée dans le navigateur : aucune base ni secret nécessaire.
      - run: pnpm --filter @devmirror/web e2e --project=audit
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/e2e-results
          retention-days: 7

  api-e2e:
    name: Tests e2e de l'API et parcours complet (branche Neon test)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      # Secret de test uniquement : les jetons signés ne servent qu'à la CI.
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - name: Vérifier le secret DATABASE_URL_TEST
        id: secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Secret DATABASE_URL_TEST absent : tests e2e ignorés."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secret.outputs.available == 'true'
        uses: actions/checkout@v5

      - if: steps.secret.outputs.available == 'true'
        uses: pnpm/action-setup@v4

      - if: steps.secret.outputs.available == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.secret.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Appliquer les migrations sur la branche test
        if: steps.secret.outputs.available == 'true'
        run: pnpm --filter @devmirror/api prisma:deploy

      - if: steps.secret.outputs.available == 'true'
        run: pnpm --filter @devmirror/api test:e2e

      # Parcours complet : front (build de production) + API locale + base de test.
      - name: Installer Chromium
        if: steps.secret.outputs.available == 'true'
        run: pnpm --filter @devmirror/web exec playwright install --with-deps chromium

      - name: Parcours inscription → projet → tâche → tableau de bord
        if: steps.secret.outputs.available == 'true'
        env:
          E2E_API: '1'
        run: pnpm --filter @devmirror/web exec playwright test --project=parcours

      - if: failure() && steps.secret.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: parcours-results
          path: apps/web/e2e-results
          retention-days: 7
