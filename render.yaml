# Blueprint Render : API NestJS (Dashboard Render > New > Blueprint > ce dépôt)
services:
  - type: web
    name: devmirror-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # pnpm via npx : le /usr/bin de Render est en lecture seule (corepack enable échoue).
    # NODE_ENV=development pendant l'installation : Nest CLI et Prisma CLI sont en devDependencies.
    buildCommand: >-
      NODE_ENV=development npx --yes pnpm@10.34.7 install --frozen-lockfile &&
      npx --yes pnpm@10.34.7 --filter @devmirror/api build &&
      npx --yes pnpm@10.34.7 --filter @devmirror/api prisma:deploy
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      # URL poolée de la branche Neon "main" (production), saisie dans le dashboard
      - key: DATABASE_URL
        sync: false
      # URL du front Vercel, par exemple https://devmirror.vercel.app
      - key: CORS_ORIGIN
        sync: false
      # Secret des jetons d'accès, généré aléatoirement par Render à la création
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Liens des emails (vérification, mot de passe oublié)
      - key: APP_URL
        value: https://real-dev-mirror-5q1b.vercel.app
      # Vercel puis Render : l'IP du client est dans X-Forwarded-For
      - key: TRUST_PROXY
        value: 'true'
      # Clé d'API Resend ; sans elle, aucun email n'est envoyé
      - key: RESEND_API_KEY
        sync: false
