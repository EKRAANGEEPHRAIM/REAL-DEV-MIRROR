<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>DevMirror</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="DevMirror — gérez vos projets, tâches et objectifs de développeur."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Applique le thème avant le premier rendu pour éviter un flash clair (voir ThemeStore).
      try {
        var mode = localStorage.getItem('devmirror.theme') || 'system';
        var dark =
          mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <dm-root></dm-root>
  </body>
</html>
